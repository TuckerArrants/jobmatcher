name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests (offline, no keys)
        run: pytest -q
      - name: Privacy check on tracked files
        run: python src/jobmatcher/privacy.py .
      - name: A public repository must never be in private-copy mode
        if: github.event.repository.private == false
        run: |
          if [ -e .jobmatcher-private ] || git ls-files --error-unmatch user/ >/dev/null 2>&1; then
            echo "::error::This repository is public but is set up as a private copy (user/ data). Make it private."; exit 1
          fi
