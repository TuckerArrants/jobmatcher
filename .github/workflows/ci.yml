name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests (offline, no keys)
        run: pytest -q
      - name: Privacy check on tracked files
        run: python src/jobmatcher/privacy.py .
      - name: The template itself must never be in private-copy mode
        if: github.event.repository.is_template
        run: |
          if [ -e .jobmatcher-private ]; then
            echo "::error::.jobmatcher-private must not exist in the public template"; exit 1
          fi
